<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Entre em Contato</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f0f13;
      color: #fff;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contato {
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    h1 span {
      color: #7c5cfc;
    }

    p {
      color: #aaa;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .whatsapp-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      padding: 15px 28px;

      background: #25D366;
      color: white;

      text-decoration: none;
      font-size: 18px;
      font-weight: bold;

      border-radius: 50px;

      transition: 0.3s;
    }

    .whatsapp-btn:hover {
      transform: scale(1.05);
      background: #20bd5a;
    }

    .whatsapp-icon {
      font-size: 24px;
    }
  </style>
</head>

<body>

  <main class="contato">

    <h1>Entre em <span>Contato</span></h1>

    <p>
      Gostaria de falar comigo?  
      Clique no botão abaixo e me envie uma mensagem pelo WhatsApp.
    </p>

    <!--
      TROQUE 5511991234567 PELO SEU NÚMERO.
      Formato: 55 + DDD + número
      Não coloque +, espaços ou hífens.
    -->

    <a
      class="whatsapp-btn"
      href="https://wa.me/5511991234567"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="whatsapp-icon">💬</span>
      Falar comigo pelo WhatsApp
    </a>

  </main>

</body>
</html>
